# ============================================================
# DISCOVER SMEs — RENDER DEPLOYMENT CONFIG
# Push this file to GitHub, then connect your repo on Render.
# Render will auto-detect and create all services below.
# Docs: https://render.com/docs/infrastructure-as-code
# ============================================================

services:
  # ─── BACKEND API (Web Service) ─────────────────────────────
  - type: web
    name: discover-smes-api
    runtime: node
    region: oregon             # Change to: frankfurt, singapore, ohio
    plan: starter              # free | starter | standard
    rootDir: .
    buildCommand: |
      npm install
      cd packages/shared && npm install && npm run build && cd ../..
      cd apps/backend && npm install && npm run db:generate && npm run build && cd ../..
    startCommand: node apps/backend/dist/server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true           # Deploy on every push to main branch

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_VERSION
        value: v1

      # Auto-linked from the Postgres service below
      - key: DATABASE_URL
        fromDatabase:
          name: discover-smes-db
          property: connectionString

      # Set these manually in Render dashboard → Environment
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false            # Set to your Render static site URL
      - key: CORS_ORIGINS
        sync: false            # e.g. https://discover-festac.onrender.com
      - key: APP_URL
        sync: false            # e.g. https://discover-festac-api.onrender.com

      # Optional — set if using OpenAI
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_MAX_TOKENS
        value: 500

      # Optional — set if using WhatsApp Cloud API
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false

      # Storage — use 'local' on free tier, 'aws' on paid
      - key: STORAGE_PROVIDER
        value: local
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false

      - key: LOG_LEVEL
        value: info
      - key: OTP_EXPIRY_MINUTES
        value: 10
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100

      # Redis — auto-linked from Redis service below
      - key: REDIS_URL
        fromService:
          type: redis
          name: discover-smes-redis
          property: connectionString
      - key: REDIS_ENABLED
        value: true
      - key: REDIS_TTL_SECONDS
        value: 3600

      # Session
      - key: SESSION_SECRET
        sync: false
      - key: SESSION_NAME
        value: discover-sms.sid
      - key: SESSION_MAX_AGE
        value: 86400000
      - key: SESSION_SECURE
        value: true
      - key: SESSION_SAME_SITE
        value: none

  # ─── FRONTEND (Static Site) ────────────────────────────────
  - type: web
    name: discover-smes-web
    runtime: static
    region: oregon
    rootDir: .
    buildCommand: |
      npm install
      cd packages/shared && npm install && npm run build && cd ../..
      cd apps/frontend && npm install && npm run build && cd ../..
    staticPublishPath: apps/frontend/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # SPA fallback — all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to your backend Render URL after deploying
      - key: VITE_API_URL
        sync: false            # e.g. https://discover-festac-api.onrender.com/api/v1

# ─── POSTGRES DATABASE ────────────────────────────────────────
# Already created manually on Render as discover-smes-db
databases:
  - name: discover-smes-db
    databaseName: discoversmes
    plan: starter              # free | starter (free has 90-day expiry)
    region: oregon

# ─── REDIS (for session storage, caching, rate limiting) ───────
- type: redis
  name: discover-smes-redis
  plan: starter              # free | starter
  region: oregon
  maxmemoryPolicy: allkeys-lru
