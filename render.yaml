# ============================================================
# DISCOVER FESTAC — RENDER DEPLOYMENT CONFIG
# Push this file to GitHub, then connect your repo on Render.
# Render will auto-detect and create all services below.
# Docs: https://render.com/docs/infrastructure-as-code
# ============================================================

services:
  # ─── BACKEND API (Web Service) ─────────────────────────────
  - type: web
    name: discover-festac-api
    runtime: node
    region: oregon             # Change to: frankfurt, singapore, ohio
    plan: starter              # free | starter | standard
    rootDir: apps/backend
    buildCommand: |
      cd ../../
      npm install
      npm run build --workspace=packages/shared
      npm run build --workspace=apps/backend
      npm run db:migrate:prod
    startCommand: node dist/server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true           # Deploy on every push to main branch

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_VERSION
        value: v1

      # Auto-linked from the Postgres service below
      - key: DATABASE_URL
        fromDatabase:
          name: discover-festac-db
          property: connectionString

      # Set these manually in Render dashboard → Environment
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false            # Set to your Render static site URL
      - key: CORS_ORIGINS
        sync: false            # e.g. https://discover-festac.onrender.com
      - key: APP_URL
        sync: false            # e.g. https://discover-festac-api.onrender.com

      # Optional — set if using OpenAI
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_MAX_TOKENS
        value: 500

      # Optional — set if using WhatsApp Cloud API
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false

      # Storage — use 'local' on free tier, 'aws' on paid
      - key: STORAGE_PROVIDER
        value: local
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false

      - key: LOG_LEVEL
        value: info
      - key: OTP_EXPIRY_MINUTES
        value: 10
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100

  # ─── FRONTEND (Static Site) ────────────────────────────────
  - type: web
    name: discover-festac-web
    runtime: static
    # region: oregon
    rootDir: apps/frontend
    buildCommand: |
      cd ../../
      npm install
      npm run build --workspace=packages/shared
      npm run build --workspace=apps/frontend
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # SPA fallback — all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to your backend Render URL after deploying
      - key: VITE_API_URL
        sync: false            # e.g. https://discover-festac-api.onrender.com/api/v1

